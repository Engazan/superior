name: Release

# Pushing a version tag (e.g. v0.1.0) builds the macOS, Windows and Linux apps
# and publishes them as assets on a GitHub Release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 43 and the Vite 7 toolchain require Node 22.12 or newer.
          node-version: 22.12.0
          cache: npm

      # node-pty ships Windows/macOS prebuilds, but Linux is compiled during
      # npm ci and therefore needs a native build toolchain.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and package
        run: npm run ${{ matrix.script }}
        env:
          # macOS Developer ID signing + notarization. CSC_* are scoped to the
          # mac runner because electron-builder also reads CSC_LINK for Windows
          # signing — leaking the mac cert there would break the Windows build.
          # The APPLE_* vars are only read by the mac notarization path, so they
          # are harmless (and empty) on the other runners.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-updater reads the installer name from latest.yml. Keep this
      # check next to the Windows build so a mismatched published filename
      # cannot turn the in-app update into a failed/manual download.
      - name: Verify Windows updater artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const metadataPath = path.join('dist', 'latest.yml')
          const metadata = fs.readFileSync(metadataPath, 'utf8')
          const installerNames = [...metadata.matchAll(/^\s*-\s+url:\s+(.+)\s*$/gm)].map(([, name]) => name.trim())

          if (installerNames.length === 0) {
            throw new Error(`${metadataPath} does not contain an update installer`)
          }

          const missing = installerNames.filter((name) => !fs.existsSync(path.join('dist', name)))
          if (missing.length > 0) {
            throw new Error(`Windows updater metadata references missing artifact(s): ${missing.join(', ')}`)
          }
          NODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superior-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
