name: CI

on:
  push:
    # Version tags run these same checks through Release's reusable-workflow job.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Use the minimum Node 22 release supported by the desktop tooling.
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test relay
        run: npm ci --prefix ../server && npm test --prefix ../server

      - name: Build relay container
        run: docker build -t superior-relay:ci ../server

      - name: Build
        run: npm run build

      - name: Enforce renderer bundle budget
        run: npm run check:bundle

  platform-smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test including daemon lifecycle
        run: npm test

  mobile:
    name: Mobile checks and native bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - run: npx expo-doctor
      - name: Export native and web bundles
        run: npx expo export --platform ios --platform android --platform web --output-dir build/bundles
